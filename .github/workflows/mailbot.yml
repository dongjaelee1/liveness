name: Commit mailbot
on: push

jobs:
  mailbot:
    if: github.actor != 'dependabot[bot]'
    uses: sanjit-bhat/github-mailbot/.github/workflows/mailbot.yml@main
    with:
      host: smtp.gmail.com
      port: 587
      from: mit.pdos.mailbot@gmail.com
      to: upamanyu@mit.edu
    secrets:
      password: ${{ secrets.MAILBOT_PASSWORD }}
